name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry without moving it
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - name: Require a release from main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: npm
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.13.0
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: npm run release:check
      - run: npm ci --ignore-scripts
      - run: npm run preflight
      - name: Publish to npm
        env:
          NPM_TAG: ${{ (github.event.release.prerelease || contains(inputs.tag, '-')) && 'next' || 'latest' }}
          NPM_CONFIG_LOGLEVEL: verbose
        run: node scripts/publish-npm.mjs
